[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcu-cli"
version = "1.0.0"
description = "One CLI for the embedded workflow: scaffold, build, flash, monitor, simulate with LEDs/buttons, debug and trace — AVR and Cortex-M, no vendor IDE"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "luimu" }]
keywords = ["avr", "atmega", "arduino", "arm", "cortex-m", "embedded", "simavr", "avrdude", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luimu64/mcu-cli"
Issues = "https://github.com/luimu64/mcu-cli/issues"

[project.scripts]
mcu = "mcu:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcu"]

[tool.ruff]
line-length = 100
target-version = "py39"
