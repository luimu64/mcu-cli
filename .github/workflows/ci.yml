name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Version check
        run: mcu --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  toolchain:
    name: with AVR + ARM toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-avr avr-libc binutils-avr gdb-avr \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            cmake ninja-build
      - name: Install mcu
        run: pip install -e .
      - name: Full suite (build + size + integration tests run for real)
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: mcu doctor
